# About section
about:
  eyebrow: "Profile"
  title: "About"
  intro: "I am a researcher at the University of Aveiro. I work on an old question. Given some data, what is the shortest program that could have produced it? That program is the best explanation of the data and the best guide to what comes next, and in general it cannot be computed. I study when it can be found anyway, and I build an engine that finds it. This work is a bridge between the theory of information and machine learning, where I study how models remember and how they learn to write correct code. It is also a bridge to medicine, where I build systems that let hospitals and laboratories learn from each other's data without sharing it."
  job_title: "Researcher & Computer Scientist"
